<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我们的第一次七夕</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{
  background:linear-gradient(145deg,#ffdbe6,#f3b7c9,#dc8ba5);
  color:#8b2f4c;
}
.scene{height:100%;display:flex;align-items:center;justify-content:center;padding:18px;perspective:1800px}
.book{position:relative;width:min(92vw,720px);height:min(78vh,540px);min-height:500px}
.page{
  position:absolute;inset:0;
  background:linear-gradient(145deg,#fff9fb,#ffe8ef);
  border-radius:24px;
  border:1px solid rgba(150,60,90,.18);
  padding:30px 24px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  transform-origin:left center;
  transition:1.1s ease;
  backface-visibility:hidden;
  box-shadow:0 18px 35px rgba(100,30,55,.2)
}
#p1{z-index:3}#p2{z-index:2}#p3{z-index:1}
.flip{transform:rotateY(-176deg)}
.inner{width:100%;max-width:580px}
.small{font-size:13px;letter-spacing:.2em;color:#b15b74;margin-bottom:16px}
h1,h2{font-family:KaiTi,STKaiti,serif;margin:0;color:#922b4c}
h1{font-size:clamp(36px,6vw,60px);line-height:1.4}
h2{font-size:clamp(34px,5vw,52px)}
.line{width:70%;height:1px;margin:24px auto;background:linear-gradient(90deg,transparent,#d88ba0,transparent)}
.desc{font-size:17px;line-height:1.8;color:#95566a}
.btn{
  margin-top:26px;padding:13px 28px;border:0;border-radius:999px;
  background:linear-gradient(135deg,#d85b7d,#b83b61);
  color:white;font-size:16px;cursor:pointer;
  box-shadow:0 10px 22px rgba(170,50,85,.25)
}
.words{font-family:KaiTi,STKaiti,serif;font-size:clamp(20px,3vw,28px);line-height:1.9;color:#714353}
.s{opacity:0;transform:translateY(12px);transition:.7s;margin:12px 0}
.s.show{opacity:1;transform:none}
#next{opacity:0;pointer-events:none;transition:.5s}
.gift{font-size:110px;cursor:pointer;animation:shake 2s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.card{
  margin:18px auto 0;width:min(90%,390px);padding:22px;border-radius:20px;
  background:rgba(255,255,255,.88);box-shadow:0 14px 30px rgba(110,35,60,.14);
  opacity:0;transform:translateY(15px) scale(.96);transition:.6s;pointer-events:none
}
.reveal .card{opacity:1;transform:none;pointer-events:auto}
.money{font-size:56px;font-weight:bold;color:#c53a61;margin:8px 0}
.final{opacity:0;transform:translateY(10px);transition:.5s;font-family:KaiTi,STKaiti,serif;font-size:22px;margin-top:14px}
.final.show{opacity:1;transform:none}
.heart{
  position:fixed;bottom:-30px;color:rgba(255,255,255,.6);
  animation:float linear infinite;pointer-events:none
}
@keyframes float{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}
@media(max-width:600px){
  .book{height:72vh;min-height:520px}
  .page{padding:24px 18px}
  .flip{transform:rotateY(-178deg)}
}
</style>
</head>

<body>
<div class="scene">
<div class="book">

<div class="page" id="p3">
  <div class="inner" id="giftPage">
    <div class="small">A LITTLE GIFT FOR YOU</div>
    <h2>请接收我的礼物 🎁</h2>
    <div class="gift" id="gift">🎁</div>
    <div class="desc">轻点礼物盒打开惊喜</div>

    <div class="card">
      <div class="small">谭女士 · 七夕心意</div>
      <div class="money">¥520.00</div>
      <div class="desc">这一份小小的仪式感，送给我坚定选择的人。</div>
      <button class="btn" id="accept">收下这份心意 ❤️</button>
      <div class="final" id="final">
        七夕快乐，贺先生。<br><br>
        希望未来的每一个七夕，<br>
        都有我们。❤️
      </div>
    </div>
  </div>
</div>

<div class="page" id="p2">
  <div class="inner">
    <div class="small">TO 贺先生</div>
    <div class="words">
      <div class="s">很庆幸能够遇见你，我们也刚好合拍。</div>
      <div class="s">在所有的选项里面，我坚定选择你。</div>
      <div class="s">喜欢不用借着节日才有仪式感，</div>
      <div class="s">因为我时时刻刻都喜欢你。☀️</div>
    </div>
    <button class="btn" id="next">继续翻页 →</button>
  </div>
</div>

<div class="page" id="p1">
  <div class="inner">
    <div class="small">OUR FIRST QIXI · 2026</div>
    <h1>谭女士 ❤️ 贺先生<br>第一次一起过七夕</h1>
    <div class="line"></div>
    <div class="desc">愿这一页，成为很多很多个七夕的开始。</div>
    <button class="btn" id="open">轻轻翻开 💗</button>
  </div>
</div>

</div>
</div>

<script>
const p1=document.getElementById("p1");
const p2=document.getElementById("p2");
const open=document.getElementById("open");
const next=document.getElementById("next");
const gift=document.getElementById("gift");
const giftPage=document.getElementById("giftPage");
const accept=document.getElementById("accept");
const final=document.getElementById("final");

open.onclick=()=>{
  p1.classList.add("flip");
  const list=document.querySelectorAll(".s");
  list.forEach((x,i)=>setTimeout(()=>x.classList.add("show"),700+i*900));
  setTimeout(()=>{
    next.style.opacity="1";
    next.style.pointerEvents="auto";
  },700+list.length*900);
};

next.onclick=()=>p2.classList.add("flip");

gift.onclick=()=>giftPage.classList.add("reveal");

accept.onclick=()=>final.classList.add("show");

for(let i=0;i<22;i++){
  const h=document.createElement("div");
  h.className="heart";
  h.innerText=Math.random()>.5?"♡":"❤";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(12+Math.random()*20)+"px";
  h.style.animationDuration=(8+Math.random()*10)+"s";
  h.style.animationDelay=(-Math.random()*12)+"s";
  document.body.appendChild(h);
}
</script>
</body>
</html>
