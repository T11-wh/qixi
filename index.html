<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我们的第一次七夕</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
}

body{
  background:linear-gradient(145deg,#fbdce6,#efb4c6,#d98ca6);
  color:#8d3450;
}

/* 背景 */
.scene{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  perspective:1800px;
}

.book{
  position:relative;
  width:min(92vw,760px);
  height:min(80vh,560px);
  min-height:500px;
  transform-style:preserve-3d;
}

/* 三页统一样式 */
.page{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:35px 28px;

  background:linear-gradient(145deg,#fffafb,#ffe8ef);
  border-radius:26px;
  border:1px solid rgba(150,60,90,.16);
  box-shadow:0 22px 40px rgba(100,30,55,.22);

  transform-origin:left center;
  transform-style:preserve-3d;
  backface-visibility:hidden;

  transition:transform 1.15s cubic-bezier(.22,.7,.2,1);
  overflow:hidden;
}

/* 非常重要：第一页永远最上层 */
#p1{z-index:30}
#p2{z-index:20}
#p3{z-index:10}

/* 翻过去 */
.page.flipped{
  transform:rotateY(-180deg);
  pointer-events:none;
}

.inner{
  width:100%;
  max-width:600px;
}

.small{
  font-size:13px;
  letter-spacing:.22em;
  color:#b35d76;
  margin-bottom:18px;
}

h1,h2{
  margin:0;
  color:#922c4c;
  font-family:"KaiTi","STKaiti",serif;
}

h1{
  font-size:clamp(36px,6vw,62px);
  line-height:1.4;
}

h2{
  font-size:clamp(34px,5vw,54px);
}

.line{
  width:65%;
  height:1px;
  margin:25px auto;
  background:linear-gradient(
    90deg,
    transparent,
    #d88da2,
    transparent
  );
}

.desc{
  color:#92566a;
  font-size:17px;
  line-height:1.8;
}

.btn{
  border:0;
  margin-top:27px;
  padding:13px 29px;
  border-radius:999px;
  color:white;
  font-size:16px;
  cursor:pointer;

  background:linear-gradient(135deg,#d75d7e,#b83e62);
  box-shadow:0 10px 25px rgba(175,50,85,.25);
}

.btn:active{
  transform:scale(.97);
}

/* 第二页文字 */
.words{
  font-family:"KaiTi","STKaiti",serif;
  font-size:clamp(21px,3vw,29px);
  line-height:1.85;
  color:#714453;
}

.sentence{
  opacity:0;
  transform:translateY(14px);
  transition:.75s ease;
  margin:11px 0;
}

.sentence.show{
  opacity:1;
  transform:none;
}

#nextBtn{
  opacity:0;
  pointer-events:none;
  transition:.5s;
}

/* 礼物 */
.gift{
  font-size:115px;
  cursor:pointer;
  margin:18px 0 5px;
  animation:giftMove 2.2s ease-in-out infinite;
}

@keyframes giftMove{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-3deg)}
  75%{transform:rotate(3deg)}
}

/* 520卡片：默认绝对隐藏 */
.gift-card{
  width:min(90%,400px);
  margin:18px auto 0;
  padding:24px;

  background:rgba(255,255,255,.9);
  border-radius:22px;
  box-shadow:0 15px 35px rgba(110,35,60,.15);

  opacity:0;
  visibility:hidden;
  transform:translateY(20px) scale(.94);

  transition:.6s ease;
}

/* 只有点击礼物以后才出现 */
#giftPage.revealed .gift-card{
  opacity:1;
  visibility:visible;
  transform:none;
}

.money{
  font-size:58px;
  font-weight:bold;
  color:#c33c61;
  margin:8px 0 12px;
}

.final{
  opacity:0;
  max-height:0;
  overflow:hidden;
  transform:translateY(10px);
  transition:.6s ease;

  font-family:"KaiTi","STKaiti",serif;
  font-size:22px;
  line-height:1.7;
  color:#8d304e;
}

.final.show{
  opacity:1;
  max-height:300px;
  transform:none;
  margin-top:18px;
}

/* 背景爱心 */
.heart{
  position:fixed;
  bottom:-40px;
  color:rgba(255,255,255,.58);
  pointer-events:none;
  animation:floatHeart linear infinite;
}

@keyframes floatHeart{
  to{
    transform:translateY(-115vh) rotate(30deg);
    opacity:0;
  }
}

@media(max-width:600px){
  .book{
    height:74vh;
    min-height:520px;
  }

  .page{
    padding:26px 19px;
  }

  h1{
    font-size:38px;
  }

  .gift{
    font-size:95px;
  }
}
</style>
</head>

<body>

<div class="scene">
<div class="book">

<!-- 第三页 -->
<section class="page" id="p3">
  <div class="inner" id="giftPage">

    <div class="small">
      A LITTLE GIFT FOR YOU
    </div>

    <h2>
      请接收我的礼物 🎁
    </h2>

    <div class="gift" id="gift">
      🎁
    </div>

    <div class="desc">
      轻点礼物盒打开惊喜
    </div>

    <div class="gift-card">

      <div class="small">
        谭女士 · 七夕心意
      </div>

      <div class="money">
        ¥520.00
      </div>

      <div class="desc">
        这一份小小的仪式感，<br>
        送给我坚定选择的人。
      </div>

      <button class="btn" id="acceptBtn">
        收下这份心意 ❤️
      </button>

      <div class="final" id="finalText">
        七夕快乐，贺先生。<br><br>
        希望未来的每一个七夕，<br>
        都有我们。❤️
      </div>

    </div>
  </div>
</section>


<!-- 第二页 -->
<section class="page" id="p2">
  <div class="inner">

    <div class="small">
      TO 贺先生
    </div>

    <div class="words">

      <div class="sentence">
        很庆幸能够遇见你，我们也刚好合拍。
      </div>

      <div class="sentence">
        在所有的选项里面，我坚定选择你。
      </div>

      <div class="sentence">
        喜欢不用借着节日才有仪式感，
      </div>

      <div class="sentence">
        因为我时时刻刻都喜欢你。☀️
      </div>

    </div>

    <button class="btn" id="nextBtn">
      继续翻页 →
    </button>

  </div>
</section>


<!-- 第一页 -->
<section class="page" id="p1">
  <div class="inner">

    <div class="small">
      OUR FIRST QIXI · 2026
    </div>

    <h1>
      谭女士 ❤️ 贺先生
      <br>
      第一次一起过七夕
    </h1>

    <div class="line"></div>

    <div class="desc">
      愿这一页，成为很多很多个七夕的开始。
    </div>

    <button class="btn" id="openBtn">
      轻轻翻开 💗
    </button>

  </div>
</section>

</div>
</div>


<script>

const p1 = document.getElementById("p1");
const p2 = document.getElementById("p2");

const openBtn = document.getElementById("openBtn");
const nextBtn = document.getElementById("nextBtn");

const gift = document.getElementById("gift");
const giftPage = document.getElementById("giftPage");

const acceptBtn = document.getElementById("acceptBtn");
const finalText = document.getElementById("finalText");


/* 第一页翻开 */
openBtn.addEventListener("click",function(){

  p1.classList.add("flipped");

  const sentences =
    document.querySelectorAll(".sentence");

  sentences.forEach(function(item,index){

    setTimeout(function(){

      item.classList.add("show");

    },600 + index*1000);

  });

  setTimeout(function(){

    nextBtn.style.opacity="1";
    nextBtn.style.pointerEvents="auto";

  },600 + sentences.length*1000);

});


/* 第二页翻开 */
nextBtn.addEventListener("click",function(){

  p2.classList.add("flipped");

});


/* 打开礼物 */
gift.addEventListener("click",function(){

  giftPage.classList.add("revealed");

});


/* 收下520 */
acceptBtn.addEventListener("click",function(){

  finalText.classList.add("show");

});


/* 背景漂浮爱心 */
for(let i=0;i<24;i++){

  const heart=document.createElement("div");

  heart.className="heart";

  heart.innerText=
    Math.random()>.5 ? "♡" : "❤";

  heart.style.left=
    Math.random()*100+"vw";

  heart.style.fontSize=
    (12+Math.random()*22)+"px";

  heart.style.animationDuration=
    (8+Math.random()*10)+"s";

  heart.style.animationDelay=
    (-Math.random()*12)+"s";

  document.body.appendChild(heart);
}

</script>

</body>
</html>
